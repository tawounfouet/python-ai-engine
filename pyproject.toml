[project]
name = "ai-engine"
version = "0.1.0"
description = "Standalone Python AI agent orchestration engine — use anywhere: scripts, notebooks, Django, FastAPI, CLI, Lambda."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Thomas AWOUNFOUET", email = "thomas.awounfouet@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["ai", "agents", "llm", "orchestration", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
ollama = ["langchain-ollama>=0.2"]
groq = ["groq>=0.4"]
gemini = ["google-generativeai>=0.5"]
sqlite = ["aiosqlite>=0.19"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
embeddings = ["sentence-transformers>=2.0"]
all = ["ai-engine[langchain,openai,anthropic,ollama,groq,gemini,sqlite]"]
django = ["django>=4.2", "djangorestframework>=3.14"]
fastapi = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Storage backends use model types at runtime (model_validate_json, dict typing, comparisons)
"src/ai_engine/storage/memory.py" = ["TCH"]
"src/ai_engine/storage/sqlite.py" = ["TCH"]
# Tests need all imports at runtime
"tests/**" = ["TCH"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
